# Kassandra behind nginx: the Flutter web build at the root, the API under /api/.
# API: `docker compose up -d` publishes it on 127.0.0.1:8000 (here 8100 via API_PORT=8100).
# Web: `flutter build web --release --dart-define=KASSANDRA_DATA=http --dart-define=API_BASE_URL=/`
#      and copy apps/kassandra_app/build/web/ to /var/www/kassandra.
# Access: open demo, the API is rate-limited per address; for a closed site uncomment auth_basic.
# Certificate: Let's Encrypt (webroot).
# Replace example.ru with your domain and check with `nginx -t` before reload.

limit_req_zone $binary_remote_addr zone=kassandra_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://example.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.ru www.example.ru;

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Referrer-Policy           "no-referrer"      always;
    # Flutter web files have no content hash in their names: revalidate, never serve a stale client.
    add_header Cache-Control             "no-cache"         always;

    # auth_basic           "Kassandra";
    # auth_basic_user_file /etc/nginx/kassandra.htpasswd;
    limit_req_status 429;

    root  /var/www/kassandra;
    index index.html;

    # Statement and 1С uploads.
    client_max_body_size 40m;

    location /api/ {
        limit_req zone=kassandra_api burst=80 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Debug page: a whole hackathon dataset (64 MB CSV) is parsed and imported in one request.
    location /api/v1/debug/ {
        limit_req zone=kassandra_api burst=80 nodelay;
        client_max_body_size 110m;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # The LLM thinks before answering: a chat turn with tools can take a minute.
    location /api/v1/ai/ {
        limit_req zone=kassandra_api burst=80 nodelay;
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8100;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
