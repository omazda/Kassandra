name: kassandra
description: Клиент Kassandra — прогноз остатка и кассового разрыва.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  collection: ^1.19.1
  dio: ^5.9.0
  file_picker: ^8.3.7
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.1
  go_router: ^16.2.4
  intl: ^0.20.2
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/app-icon-1024.png
  adaptive_icon_background: "#0F2B2E"
  adaptive_icon_foreground: assets/logo/app-icon-foreground.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/logo/app-icon-1024.png
    background_color: "#0F2B2E"
    theme_color: "#1E6E70"
  windows:
    generate: true
    image_path: assets/logo/app-icon-1024.png
  macos:
    generate: true
    image_path: assets/logo/app-icon-1024.png

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/c003_2026-04-26.json
    - assets/fixtures/c003_v1_1.json
    - assets/fixtures/c003_v1_1_calendar.json
    - assets/logo/
    - assets/fonts/OFL.txt
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText-Regular.ttf
          weight: 400
        - asset: assets/fonts/GolosText-Medium.ttf
          weight: 500
        - asset: assets/fonts/GolosText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GolosText-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
